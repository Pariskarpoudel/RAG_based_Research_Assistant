name: Build & Deploy Docker to EC2 via ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          echo "Building and pushing image..."
          
          # Build the image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push to AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "✅ Successfully built and pushed to ECR"

  deploy-to-ec2:
    needs: build-and-push
    runs-on: self-hosted
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-deploy
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy new container
        env:
          # Get ECR registry from THIS job's login (not from previous job)
          ECR_REGISTRY: ${{ steps.login-ecr-deploy.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          # Construct the full image URL using local environment variables
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          echo "Deploying image: $IMAGE"
          
          # Validate all components are present
          if [ -z "$ECR_REGISTRY" ] || [ -z "$ECR_REPOSITORY" ] || [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: Missing image components"
            echo "ECR_REGISTRY: $ECR_REGISTRY"
            echo "ECR_REPOSITORY: $ECR_REPOSITORY"
            echo "IMAGE_TAG: $IMAGE_TAG"
            exit 1
          fi
          
          # Stop & remove old container (ignore errors if it doesn't exist)
          docker stop rag-app 2>/dev/null || true
          docker rm rag-app 2>/dev/null || true
          
          # Pull the latest image from ECR
          echo "Pulling image from ECR..."
          docker pull $IMAGE
          
          # Run the container with environment variables
          echo "Starting new container..."
          docker run -d \
            --name rag-app \
            --restart unless-stopped \
            -p 8000:8000 \
            -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            -e COHERE_API_KEY="${{ secrets.COHERE_API_KEY }}" \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            -e SUPABASE_PASSWORD="${{ secrets.SUPABASE_PASSWORD }}" \
            $IMAGE
          
          # Wait for container to start
          sleep 3
          
          # Verify the container is running
          if docker ps | grep -q rag-app; then
            echo "✅ Container is running successfully"
            docker ps | grep rag-app
          else
            echo "❌ Container failed to start!"
            echo "Container logs:"
            docker logs rag-app 2>&1 || echo "No logs available"
            exit 1
          fi
          
          # Clean up unused dangling images to save EC2 disk space
          docker image prune -f
          
          echo "✅ Deployment completed successfully!"